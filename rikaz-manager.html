<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rikaz — بوابة المدير</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
:root{--gold:#D4AF37;--gold2:#C9960C;--b900:#0A0F2E;--b800:#12235C;--b700:#1A3A8F;--g900:#1A6B3A;--r900:#B71C1C;--o900:#E65100;--border:#E2E8F0;--muted:#6B7C93;--bg:#F0F2FA}
body{background:var(--bg);min-height:100vh;color:#0A0F2E}
 
/* Login */
#login-screen{position:fixed;inset:0;background:linear-gradient(160deg,#0A0F2E,#12235C);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:rgba(255,255,255,.07);border:1px solid rgba(212,175,55,.25);border-radius:20px;padding:32px 24px;width:min(380px,90vw)}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo .title{color:#D4AF37;font-size:24px;font-weight:800}
.login-logo .sub{color:#9BBFE4;font-size:12px;margin-top:4px}
.inp{width:100%;padding:12px 14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;font-size:14px;margin-bottom:10px;font-family:inherit;outline:none}
.inp::placeholder{color:rgba(255,255,255,.4)}
.btn-gold{width:100%;padding:13px;background:linear-gradient(135deg,#C9960C,#D4AF37);color:#0A0F2E;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.login-err{color:#FF8A80;font-size:12px;text-align:center;margin:6px 0;display:none}
 
/* App */
#app{display:none}
.topbar{background:linear-gradient(135deg,#0A0F2E,#12235C);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.topbar-left{display:flex;align-items:center;gap:16px}
.logo{color:#D4AF37;font-size:16px;font-weight:800}
.role-badge{background:rgba(212,175,55,.2);color:#D4AF37;border:1px solid rgba(212,175,55,.3);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.nav-tabs{display:flex;gap:4px}
.nav-tab{background:none;border:none;color:#9BBFE4;font-size:13px;padding:6px 14px;cursor:pointer;border-radius:6px;font-family:inherit}
.nav-tab.active{background:rgba(212,175,55,.15);color:#D4AF37;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px}
.mgr-name{color:#9BBFE4;font-size:12px}
.logout-btn{background:none;border:1px solid rgba(255,255,255,.2);color:#9BBFE4;padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
 
.main{padding:20px;max-width:1200px;margin:0 auto}
.page{display:none}.page.active{display:block}
 
/* Cards */
.card{background:#fff;border-radius:12px;border:1px solid var(--border);padding:18px;margin-bottom:14px}
.card-title{font-size:14px;font-weight:700;color:var(--b900);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:4px;height:16px;background:#D4AF37;border-radius:2px;display:inline-block}
 
/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border-radius:10px;padding:14px;border:1px solid var(--border);text-align:center}
.kpi-val{font-size:26px;font-weight:700;color:var(--b900)}
.kpi-lbl{font-size:11px;color:var(--muted);margin-top:4px}
.kpi.green .kpi-val{color:#C9960C}
.kpi.red .kpi-val{color:var(--r900)}
 
/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:10px 12px;background:var(--bg);color:var(--b800);font-weight:600;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--bg)}
 
/* Badges */
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
.b-green{background:#FDF6DC;color:#A07808}
.b-red{background:#FFEBEE;color:#C62828}
.b-blue{background:#E3F2FD;color:#1565C0}
.b-gray{background:#F5F5F5;color:#616161}
.b-amber{background:#FFF8E1;color:#E65100}
.b-pending{background:#FFF3E0;color:#E65100}
 
/* Buttons */
.btn{padding:7px 16px;border-radius:8px;font-size:13px;cursor:pointer;border:none;font-weight:600;font-family:inherit}
.btn-approve{background:#1A6B3A;color:#fff}
.btn-reject{background:var(--r900);color:#fff}
.btn-sm{padding:5px 12px;font-size:12px}
 
/* Request cards */
.req-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.req-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.req-emp{font-weight:700;font-size:14px}
.req-type{font-size:12px;color:var(--muted)}
.req-detail{font-size:13px;color:var(--b800);margin-bottom:10px;background:var(--bg);padding:8px 10px;border-radius:6px}
.req-actions{display:flex;gap:8px}
.req-actions .btn{flex:1}
 
/* تسلسل الموافقة */
.approval-chain{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:6px}
.chain-step{padding:2px 8px;border-radius:4px;font-weight:600}
.chain-done{background:#EAF3DE;color:#1A6B3A}
.chain-current{background:#FDF6DC;color:#A07808;border:1px solid #E8C96A}
.chain-pending{background:#F5F5F5;color:#9E9E9E}
.chain-arrow{color:var(--muted)}
 
/* Attendance */
.att-status-present{color:#1A6B3A;font-weight:600}
.att-status-absent{color:var(--r900);font-weight:600}
.att-status-leave{color:#A07808;font-weight:600}
.att-status-late{color:var(--o900);font-weight:600}
 
/* Spinner */
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
 
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0A0F2E;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;border-right:3px solid #D4AF37;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
 
<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="title">Rikaz</div>
      <div class="sub">بوابة المدير</div>
    </div>
    <div class="login-err" id="login-err"></div>
    <input class="inp" id="l-email" type="email" placeholder="البريد الإلكتروني" dir="ltr" onkeydown="if(event.key==='Enter')document.getElementById('l-pass').focus()">
    <input class="inp" id="l-pass" type="password" placeholder="كلمة المرور" dir="ltr" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-gold" onclick="doLogin()" id="l-btn">دخول</button>
  </div>
</div>
 
<!-- App -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">Rikaz</div>
      <div class="role-badge" id="role-badge">مدير</div>
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="showPage('requests')" id="tab-requests">📋 الطلبات</button>
        <button class="nav-tab" onclick="showPage('attendance')" id="tab-attendance">⏱️ الحضور</button>
        <button class="nav-tab" onclick="showPage('team')" id="tab-team">👥 الفريق</button>
        <button class="nav-tab" id="tab-reports" onclick="showPage('reports')" style="display:none">📊 التقارير</button>
      </div>
    </div>
    <div class="topbar-right">
      <div class="mgr-name" id="mgr-name-lbl"></div>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>
 
  <div class="main">
 
    <!-- ══ الطلبات ══ -->
    <div class="page active" id="page-requests">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <h2 style="font-size:18px;font-weight:700;color:var(--b900)">📋 الطلبات المعلقة</h2>
        <div style="display:flex;gap:8px">
          <select id="req-type-filter" onchange="renderRequests()" style="padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff">
            <option value="">جميع الطلبات</option>
            <option value="سنوية">إجازة سنوية</option>
            <option value="استئذان">استئذان</option>
            <option value="غياب">تبليغ غياب</option>
            <option value="تأخر">تأخر</option>
          </select>
        </div>
      </div>
      <div class="kpi-grid" id="req-kpis"></div>
      <div id="requests-list"><div style="text-align:center;padding:40px;color:var(--muted)">جاري التحميل...</div></div>
    </div>
 
    <!-- ══ الحضور ══ -->
    <div class="page" id="page-attendance">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <h2 style="font-size:18px;font-weight:700;color:var(--b900)">⏱️ تقرير الحضور</h2>
        <input type="date" id="att-date" onchange="renderAttendance()" style="padding:7px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px">
      </div>
      <div class="kpi-grid" id="att-kpis"></div>
      <div class="card">
        <div class="card-title">سجل الحضور اليومي</div>
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>#</th><th>الموظف</th><th>الحالة</th>
              <th>وقت الحضور</th><th>وقت الانصراف</th><th>الموقع</th>
            </tr></thead>
            <tbody id="att-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
 
    <!-- ══ الفريق ══ -->
    <div class="page" id="page-team">
      <h2 style="font-size:18px;font-weight:700;color:var(--b900);margin-bottom:16px">👥 فريقي</h2>
      <div class="kpi-grid" id="team-kpis"></div>
      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>#</th><th>الموظف</th><th>رقم الهوية</th>
              <th>القسم</th><th>المسمى</th><th>نوع الدوام</th><th>الحالة</th>
            </tr></thead>
            <tbody id="team-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
 
    <!-- ══ التقارير (مدير عام) ══ -->
    <div class="page" id="page-reports">
      <h2 style="font-size:18px;font-weight:700;color:var(--b900);margin-bottom:16px">📊 التقارير التنفيذية</h2>
      <div class="kpi-grid" id="reports-kpis"></div>
      <div class="card">
        <div class="card-title">ملخص الشهر الحالي</div>
        <div id="reports-body" style="color:var(--muted);font-size:13px">جاري التحميل...</div>
      </div>
    </div>
 
  </div>
</div>
 
<div class="toast" id="toast"></div>
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const RIKAZ_URL = 'https://dkbpajjnadlycnpoivim.supabase.co';
const RIKAZ_KEY = 'sb_publishable_b3dw5D-des45_hhx1RB8eA_N6bbLU3A';
const db = supabase.createClient(RIKAZ_URL, RIKAZ_KEY);
 
let currentUser = null;
let managerProfile = null; // بيانات المدير من إعدادات HR
let myTeam = []; // موظفو الفريق
let allLeaves = [];
let allEmployees = [];
let allAttendance = [];
let ownerUserId = null; // user_id لـ HR المالك
 
// ══ تسجيل الدخول ══
async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  const btn   = document.getElementById('l-btn');
  const err   = document.getElementById('login-err');
  if(!email||!pass){showErr('أدخل البريد وكلمة المرور');return;}
  btn.innerHTML='<span class="spin"></span>';btn.disabled=true;err.style.display='none';
  const {data,error} = await db.auth.signInWithPassword({email,password:pass});
  if(error){btn.textContent='دخول';btn.disabled=false;showErr('بيانات غير صحيحة');return;}
  currentUser = data.user;
  await loadManagerProfile();
}
 
function showErr(msg){const e=document.getElementById('login-err');e.textContent=msg;e.style.display='block';}
async function doLogout(){await db.auth.signOut();location.reload();}
 
// ══ تحميل بيانات المدير ══
async function loadManagerProfile() {
  // البحث عن المدير في جدول managers لكل المستخدمين
  const {data, error} = await db.from('managers')
    .select('*')
    .eq('manager_email', currentUser.email)
    .single();
 
  if(error || !data) {
    showErr('لا يوجد صلاحيات مدير لهذا الحساب — تواصل مع HR');
    document.getElementById('l-btn').textContent='دخول';
    document.getElementById('l-btn').disabled=false;
    return;
  }
 
  managerProfile = data;
  ownerUserId = data.owner_user_id;
  await loadAllData();
  showApp();
}
 
// ══ تحميل جميع البيانات ══
async function loadAllData() {
  const [empsRes, leavesRes, attRes] = await Promise.all([
    db.from('employees').select('data').eq('user_id', ownerUserId).single(),
    db.from('leaves').select('data').eq('user_id', ownerUserId).single(),
    db.from('attendance').select('*').eq('user_id', ownerUserId).order('timestamp', {ascending:false}).limit(500),
  ]);
 
  allEmployees = empsRes.data?.data || [];
  allLeaves    = leavesRes.data?.data || [];
  allAttendance = attRes.data || [];
 
  // فلتر فريق هذا المدير
  myTeam = filterMyTeam(allEmployees);
}
 
function filterMyTeam(emps) {
  const p = managerProfile;
  if(!p) return [];
  const active = emps.filter(e => e.status !== 'منتهي الخدمة');
 
  if(p.role === 'gm' || p.role === 'hr') return active;
 
  let team = [];
 
  // حسب الإدارة (المديرون الجدد من إعدادات الشركة)
  if(p.division_filter?.length) {
    p.division_filter.forEach(div => {
      active.filter(e => e.division === div)
        .forEach(e => { if(!team.find(t=>t.empId===e.empId)) team.push(e); });
    });
  }
 
  // حسب القسم
  if(p.dept_filter?.length) {
    p.dept_filter.forEach(dept => {
      team.push(...active.filter(e => e.dept === dept));
    });
  }
 
  // حسب الموقع
  if(p.location_filter?.length) {
    p.location_filter.forEach(loc => {
      active.filter(e => e.workLocation === loc || e.attendanceType === loc)
        .forEach(e => { if(!team.find(t=>t.empId===e.empId)) team.push(e); });
    });
  }
 
  // يدوي
  if(p.manual_emp_ids?.length) {
    p.manual_emp_ids.forEach(id => {
      const e = active.find(e => e.empId === id);
      if(e && !team.find(t=>t.empId===e.empId)) team.push(e);
    });
  }
 
  return team;
}
 
// ══ إظهار التطبيق ══
function showApp() {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
 
  const roleLabels = {manager:'مدير', hr:'HR', gm:'مدير عام'};
  document.getElementById('role-badge').textContent = roleLabels[managerProfile.role] || 'مدير';
  document.getElementById('mgr-name-lbl').textContent = managerProfile.manager_name || currentUser.email;
 
  // المدير العام يشوف التقارير
  if(managerProfile.role === 'gm') {
    document.getElementById('tab-reports').style.display='inline-block';
  }
 
  document.getElementById('att-date').value = new Date().toISOString().split('T')[0];
  renderRequests();
  renderTeam();
  applyPermTabs();
}
 
function showPage(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.getElementById('tab-'+page)?.classList.add('active');
  if(page==='attendance') renderAttendance();
  if(page==='reports') renderReports();
}
 
// ══ الطلبات ══
function getMgrPerms() {
  // قراءة صلاحيات المدير من إعدادات الإدارات
  const email = currentUser?.email || '';
  const name  = managerProfile?.manager_name || '';
  const cs = companySettings || {};
  const divs = cs.divisions || [];
 
  for(const div of divs) {
    for(const mgr of (div.managers||[])) {
      if(mgr.name === name || mgr.name === email) {
        return mgr.perms || [];
      }
    }
  }
  // افتراضي: كل الصلاحيات للـ gm/hr
  if(managerProfile?.role === 'gm' || managerProfile?.role === 'hr') {
    return ['salary','leave','loan','eos','attendance','violations','custom'];
  }
  return managerProfile?.perms || [];
}
 
function applyPermTabs() {
  const perms = getMgrPerms();
  // إظهار/إخفاء تبويبات حسب الصلاحيات
  const tabMap = {
    'tab-salary':     'salary',
    'tab-leaves':     'leave',
    'tab-loans':      'loan',
    'tab-eos':        'eos',
    'tab-attendance': 'attendance',
  };
  Object.entries(tabMap).forEach(([tabId, perm]) => {
    const el = document.getElementById(tabId);
    if(el) el.style.display = perms.includes(perm) ? '' : 'none';
  });
}
 
function hasPerm(perm) {
  return getMgrPerms().includes(perm);
}
 
function renderRequests() {
  const typeFilter = document.getElementById('req-type-filter')?.value || '';
  const teamIds = new Set(myTeam.map(e=>e.empId));
  const teamNames = new Set(myTeam.map(e=>e.name));
 
  // طلبات الفريق فقط
  let reqs = allLeaves.filter(l => {
    const inTeam = teamIds.has(l.empId) || teamNames.has(l.emp);
    if(!inTeam) return false;
    if(typeFilter && l.type !== typeFilter) return false;
 
    // عرض الطلبات المعلقة عند مستوى هذا المدير
    if(l.status !== 'معلق') return false;
 
    const steps = l.approvalSteps || ['مدير', 'HR', 'مدير عام'];
    const currentStep = l.currentStep || 0;
    const currentStepLabel = steps[currentStep] || '';
 
    const roleToStep = {
      manager: ['مدير','مدير مباشر','مدير قسم'],
      hr:      ['HR','موارد بشرية'],
      gm:      ['مدير عام','المدير العام']
    };
 
    const myLabels = roleToStep[managerProfile.role] || [];
    return myLabels.some(lbl => currentStepLabel.includes(lbl));
  });
 
  // KPIs
  document.getElementById('req-kpis').innerHTML = `
    <div class="kpi"><div class="kpi-val">${reqs.length}</div><div class="kpi-lbl">طلبات معلقة</div></div>
    <div class="kpi green"><div class="kpi-val">${allLeaves.filter(l=>(teamIds.has(l.empId)||teamNames.has(l.emp))&&l.status==='موافق').length}</div><div class="kpi-lbl">معتمدة</div></div>
    <div class="kpi red"><div class="kpi-val">${allLeaves.filter(l=>(teamIds.has(l.empId)||teamNames.has(l.emp))&&l.status==='مرفوض').length}</div><div class="kpi-lbl">مرفوضة</div></div>
    <div class="kpi"><div class="kpi-val">${myTeam.length}</div><div class="kpi-lbl">حجم الفريق</div></div>
  `;
 
  const container = document.getElementById('requests-list');
  if(!reqs.length) {
    container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)">
      <div style="font-size:40px;margin-bottom:12px">✅</div>
      <div style="font-size:16px;font-weight:600">لا يوجد طلبات معلقة</div>
    </div>`;
    return;
  }
 
  container.innerHTML = reqs.map(req => {
    const typeLabel = {سنوية:'🌴 إجازة سنوية', استئذان:'⏰ استئذان', غياب:'📋 تبليغ غياب', تأخر:'⚠️ تأخر'}[req.type] || req.type;
 
    // تسلسل الموافقة
    const chain = getApprovalChain(req);
 
    return `<div class="req-card">
      <div class="req-header">
        <div>
          <div class="req-emp">${req.emp || req.empId}</div>
          <div class="req-type">${typeLabel} • ${req.from||''} ${req.to&&req.to!==req.from?'← '+req.to:''} ${req.days?'('+req.days+' يوم)':''}</div>
        </div>
        <span class="badge b-pending">${req.status}</span>
      </div>
      ${req.note?`<div class="req-detail">💬 ${req.note}</div>`:''}
      <div class="approval-chain">${chain}</div>
      <div class="req-actions" style="margin-top:10px">
        <button class="btn btn-approve btn-sm" onclick="approveRequest(${req.id})">✅ موافقة</button>
        <button class="btn btn-reject btn-sm" onclick="rejectRequest(${req.id})">❌ رفض</button>
      </div>
    </div>`;
  }).join('');
}
 
function getApprovalChain(req) {
  // استخدم السلسلة المخصصة إذا وجدت
  const steps = req.approvalSteps?.length
    ? req.approvalSteps
    : ['مدير', 'HR', 'مدير عام'];
 
  const currentStep = req.currentStep || 0;
 
  return steps.map((label, i) => {
    const done    = i < currentStep;
    const current = i === currentStep && req.status === 'معلق';
    return `
      <span class="chain-step ${done?'chain-done':current?'chain-current':'chain-pending'}">${label}</span>
      ${i < steps.length-1 ? '<span class="chain-arrow">←</span>' : ''}`;
  }).join('') + (req.approvalChainName ? `<span style="font-size:10px;color:var(--muted);margin-right:6px">(${req.approvalChainName})</span>` : '');
}
 
async function approveRequest(reqId) {
  const req = allLeaves.find(l => l.id === reqId);
  if(!req) return;
 
  const steps = req.approvalSteps || ['مدير', 'HR', 'مدير عام'];
  const currentStep = req.currentStep || 0;
  const nextStep = currentStep + 1;
 
  let nextStatus;
  if(nextStep >= steps.length) {
    nextStatus = 'موافق'; // اكتملت السلسلة
  } else {
    nextStatus = 'معلق'; // لا يزال معلقاً للخطوة التالية
  }
 
  // تحديث الطلب مع الخطوة التالية
  const updated = allLeaves.map(l => {
    if(l.id !== reqId) return l;
    return {
      ...l,
      status: nextStatus,
      currentStep: nextStep,
      [`step${currentStep}_approvedBy`]: managerProfile.manager_name,
      [`step${currentStep}_approvedDate`]: new Date().toISOString().split('T')[0]
    };
  });
 
  await db.from('leaves').upsert({user_id: ownerUserId, data: updated, updated_at: new Date().toISOString()});
 
  const stepLabel = steps[currentStep] || '';
  showToast(`✅ موافقة ${stepLabel} — ${nextStep < steps.length ? 'انتظار '+steps[nextStep] : 'اعتُمد نهائياً'}`);
  await loadAllData();
  renderRequests();
}
 
async function rejectRequest(reqId) {
  const reason = prompt('سبب الرفض (اختياري):') || '';
  await updateLeaveStatus(reqId, 'مرفوض', reason);
  showToast('تم الرفض');
  await loadAllData();
  renderRequests();
}
 
async function updateLeaveStatus(reqId, status, note='') {
  const updated = allLeaves.map(l => {
    if(l.id === reqId) {
      return {...l, status, ...(note?{rejectNote:note}:{}),
        [`${managerProfile.role}ApprovedBy`]: managerProfile.manager_name,
        [`${managerProfile.role}ApprovedDate`]: new Date().toISOString().split('T')[0]
      };
    }
    return l;
  });
  await db.from('leaves').upsert({user_id: ownerUserId, data: updated, updated_at: new Date().toISOString()});
}
 
// ══ الحضور ══
async function renderAttendance() {
  const date = document.getElementById('att-date')?.value || new Date().toISOString().split('T')[0];
  const teamIds = new Set(myTeam.map(e=>e.empId));
  const teamNames = new Set(myTeam.map(e=>e.name));
 
  const todayAtt = allAttendance.filter(a =>
    a.timestamp?.startsWith(date) &&
    (teamIds.has(a.emp_id) || teamNames.has(a.emp_name))
  );
 
  const checkins  = todayAtt.filter(a=>a.type==='checkin');
  const checkouts = todayAtt.filter(a=>a.type==='checkout');
  const presentIds = new Set(checkins.map(a=>a.emp_id||a.emp_name));
 
  // طلبات إجازة معتمدة اليوم
  const onLeaveToday = allLeaves.filter(l =>
    (l.status==='موافق'||l.status==='موافق HR') &&
    l.from<=date && l.to>=date &&
    (teamIds.has(l.empId)||teamNames.has(l.emp))
  );
  const onLeaveNames = new Set([...onLeaveToday.map(l=>l.empId),...onLeaveToday.map(l=>l.emp)]);
 
  const absent = myTeam.filter(e => !presentIds.has(e.empId) && !onLeaveNames.has(e.empId) && !onLeaveNames.has(e.name));
 
  document.getElementById('att-kpis').innerHTML = `
    <div class="kpi green"><div class="kpi-val">${presentIds.size}</div><div class="kpi-lbl">حاضر ✅</div></div>
    <div class="kpi red"><div class="kpi-val">${absent.length}</div><div class="kpi-lbl">غائب 🔴</div></div>
    <div class="kpi"><div class="kpi-val">${onLeaveToday.length}</div><div class="kpi-lbl">إجازة 🌴</div></div>
    <div class="kpi"><div class="kpi-val">${myTeam.length}</div><div class="kpi-lbl">إجمالي الفريق</div></div>
  `;
 
  const tbody = document.getElementById('att-tbody');
  if(!myTeam.length){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">لا يوجد فريق</td></tr>';return;}
 
  tbody.innerHTML = myTeam.map((emp,i) => {
    const cin  = checkins.find(a=>a.emp_id===emp.empId||a.emp_name===emp.name);
    const cout = checkouts.find(a=>a.emp_id===emp.empId||a.emp_name===emp.name);
    const isLeave = onLeaveNames.has(emp.empId)||onLeaveNames.has(emp.name);
 
    let statusHtml, cinTime='—', coutTime='—', locHtml='—';
    if(isLeave){
      statusHtml = '<span class="att-status-leave">🌴 إجازة</span>';
    } else if(cin) {
      cinTime = new Date(cin.timestamp).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
      statusHtml = '<span class="att-status-present">✅ حاضر</span>';
      if(cout) coutTime = new Date(cout.timestamp).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
      if(cin.lat) locHtml = `<a href="https://www.google.com/maps?q=${cin.lat},${cin.lng}" target="_blank" style="color:#C9960C;font-size:12px">📍 خريطة</a>`;
    } else {
      statusHtml = '<span class="att-status-absent">🔴 غائب</span>';
    }
 
    return `<tr>
      <td style="color:var(--muted);font-size:11px">${i+1}</td>
      <td style="font-weight:600">${emp.name}</td>
      <td>${statusHtml}</td>
      <td>${cinTime}</td>
      <td>${coutTime}</td>
      <td>${locHtml}</td>
    </tr>`;
  }).join('');
}
 
// ══ الفريق ══
function renderTeam() {
  document.getElementById('team-kpis').innerHTML = `
    <div class="kpi"><div class="kpi-val">${myTeam.length}</div><div class="kpi-lbl">إجمالي الفريق</div></div>
    <div class="kpi"><div class="kpi-val">${myTeam.filter(e=>e.attendanceType==='field').length}</div><div class="kpi-lbl">ميداني</div></div>
    <div class="kpi"><div class="kpi-val">${myTeam.filter(e=>e.attendanceType!=='field'&&e.attendanceType!=='exempt').length}</div><div class="kpi-lbl">مكتبي</div></div>
  `;
 
  const tbody = document.getElementById('team-tbody');
  tbody.innerHTML = myTeam.map((emp,i) => `
    <tr>
      <td style="color:var(--muted);font-size:11px">${i+1}</td>
      <td style="font-weight:600">${emp.name}</td>
      <td style="font-family:monospace;font-size:12px">${emp.empId||'—'}</td>
      <td>${emp.dept||'—'}</td>
      <td style="font-size:12px;color:var(--muted)">${emp.title||emp.job||'—'}</td>
      <td><span class="badge ${emp.attendanceType==='field'?'b-amber':emp.attendanceType==='exempt'?'b-gray':'b-blue'}">${emp.attendanceType==='field'?'ميداني':emp.attendanceType==='exempt'?'معفى':'مكتبي'}</span></td>
      <td><span class="badge ${emp.status==='نشط'?'b-green':'b-gray'}">${emp.status||'نشط'}</span></td>
    </tr>`).join('');
}
 
// ══ التقارير (مدير عام) ══
async function renderReports() {
  if(managerProfile.role !== 'gm') return;
  const active = allEmployees.filter(e=>e.status!=='منتهي الخدمة');
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthLeaves = allLeaves.filter(l=>l.submit?.startsWith(thisMonth));
  const approved = monthLeaves.filter(l=>l.status==='موافق').length;
  const pending  = allLeaves.filter(l=>l.status==='معلق'||l.status==='موافق مدير'||l.status==='موافق HR').length;
 
  document.getElementById('reports-kpis').innerHTML = `
    <div class="kpi"><div class="kpi-val">${active.length}</div><div class="kpi-lbl">إجمالي الموظفين</div></div>
    <div class="kpi green"><div class="kpi-val">${approved}</div><div class="kpi-lbl">إجازات معتمدة هذا الشهر</div></div>
    <div class="kpi red"><div class="kpi-val">${pending}</div><div class="kpi-lbl">طلبات معلقة</div></div>
    <div class="kpi"><div class="kpi-val">${active.filter(e=>e.attendanceType==='field').length}</div><div class="kpi-lbl">موظفون ميدانيون</div></div>
  `;
 
  document.getElementById('reports-body').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="background:var(--bg);border-radius:8px;padding:12px">
        <div style="font-weight:600;margin-bottom:8px">توزيع الأقسام</div>
        ${[...new Set(active.map(e=>e.dept).filter(Boolean))].map(dept =>
          `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border)">
            <span>${dept}</span>
            <span style="font-weight:600">${active.filter(e=>e.dept===dept).length}</span>
          </div>`
        ).join('')}
      </div>
      <div style="background:var(--bg);border-radius:8px;padding:12px">
        <div style="font-weight:600;margin-bottom:8px">حالة الطلبات هذا الشهر</div>
        ${['معلق','موافق مدير','موافق HR','موافق','مرفوض'].map(status => {
          const count = monthLeaves.filter(l=>l.status===status).length;
          return count ? `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border)">
            <span>${status}</span><span style="font-weight:600">${count}</span>
          </div>` : '';
        }).join('')}
      </div>
    </div>`;
}
 
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
 
async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(session){currentUser=session.user;await loadManagerProfile();}
}
init();
</script>
